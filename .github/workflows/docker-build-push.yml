name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build, such as refs/tags/v2.0.10
        required: true
        type: string
      version:
        description: Release version without the v prefix, such as 2.0.10
        required: true
        type: string
  push:
    branches:
      - main
      - master
      - dev
    paths:
      - '**.py'
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'templates/**'
      - 'static/**'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: lsh-okok/ok-email
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/lsh-okok/ok-email

jobs:
  build-from-event:
    if: ${{ inputs.version == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub is optional: without DOCKERHUB_USERNAME/DOCKERHUB_TOKEN we still
      # push to GHCR (which only needs the built-in GITHUB_TOKEN). This keeps the
      # image available even before the Docker Hub secrets are configured.
      - name: Check Docker Hub credentials
        id: dhcreds
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set; skipping the Docker Hub push and only publishing to GHCR."
          fi

      - name: Log in to Docker Hub
        if: steps.dhcreds.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern=v{{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Select push targets
        id: targets
        env:
          ALL_TAGS: ${{ steps.meta.outputs.tags }}
          HUB_ENABLED: ${{ steps.dhcreds.outputs.enabled }}
        run: |
          set -euo pipefail
          {
            echo 'tags<<PUSH_TAGS_EOF'
            if [ "$HUB_ENABLED" = 'true' ]; then
              printf '%s\n' "$ALL_TAGS"
            else
              printf '%s\n' "$ALL_TAGS" | grep '^ghcr\.io/' || true
            fi
            echo 'PUSH_TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.targets.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}

  build-from-release:
    if: ${{ inputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub credentials
        id: dhcreds
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set; skipping the Docker Hub push and only publishing to GHCR."
          fi

      - name: Log in to Docker Hub
        if: steps.dhcreds.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=v${{ inputs.version }}
            type=raw,value=latest

      - name: Select push targets
        id: targets
        env:
          ALL_TAGS: ${{ steps.meta.outputs.tags }}
          HUB_ENABLED: ${{ steps.dhcreds.outputs.enabled }}
        run: |
          set -euo pipefail
          {
            echo 'tags<<PUSH_TAGS_EOF'
            if [ "$HUB_ENABLED" = 'true' ]; then
              printf '%s\n' "$ALL_TAGS"
            else
              printf '%s\n' "$ALL_TAGS" | grep '^ghcr\.io/' || true
            fi
            echo 'PUSH_TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.targets.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}
